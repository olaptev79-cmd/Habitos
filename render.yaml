services:
  - type: web
    name: habitos-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/habitos.db
    disk:
      name: habitos-data
      mountPath: /var/data
      sizeGB: 1

  - type: static
    name: habitos-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://habitos-api.onrender.com/api
